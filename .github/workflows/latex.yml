name: Build LaTeX templates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engineering-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install TeX Live packages
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-science texlive-fonts-recommended texlive-pictures texlive-bibtex-extra biber
      - name: Compile template
        working-directory: templates/engineering-report
        run: make
      - name: Reject LaTeX warnings
        run: python3 scripts/check_latex_log.py templates/engineering-report/main.log
      - name: Upload PDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engineering-report-pdf
          path: templates/engineering-report/main.pdf
